<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Seguro</title>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background-color: #1e293b;
            border-radius: 16px;
            padding: 30px 20px;
            max-width: 380px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
        }
        .title {
            color: #38bdf8;
            font-weight: bold;
            font-size: 14px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }
        .alert-box {
            background-color: rgba(239, 68, 68, 0.15);
            border: 1px solid #ef4444;
            color: #fca5a5;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.4;
            margin-bottom: 20px;
            text-align: left;
        }
        .alert-box strong {
            color: #ffffff;
        }
        .btn {
            background-color: #22c55e;
            color: white;
            text-decoration: none;
            padding: 16px 20px;
            border-radius: 30px;
            font-weight: bold;
            display: block;
            width: 100%;
            box-sizing: border-box;
            font-size: 16px;
            margin-bottom: 25px;
            cursor: pointer;
            border: none;
            transition: background-color 0.3s;
        }
        .btn:hover {
            background-color: #16a34a;
        }
        .text {
            font-size: 14px;
            color: #cbd5e1;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="title">VERIFICACIÓN DE ACCESO</div>
        
        <div class="alert-box">
            ⚠️ <strong>Importante:</strong> Para que tu trámite no marque error, toca los <strong>tres puntos (...)</strong> arriba a la derecha en tu pantalla y selecciona <strong>"Abrir en el navegador"</strong>.
        </div>

        <p class="text">Haz clic en el botón para continuar con tu solicitud:</p>
        
        <!-- Botón interactivo con función de salto inteligente -->
        <button onclick="abrirEnlaceExterno()" class="btn">
            Continuar con la solicitud ➜
        </button>
    </div>

    <script>
        function abrirEnlaceExterno() {
            // Reemplaza esta URL con tu enlace exacto
            var urlDestino = "https://vdmarketing.postaffiliatepro.com/scripts/qzcw1549?a_aid=Vickycas&a_bid=d20ae98c";
            
            // Intenta abrir el enlace forzando pestaña nueva / externa
            var win = window.open(urlDestino, '_system');
            if (!win) {
                window.location.href = urlDestino;
            }
        }
    </script>

</body>
</html>
